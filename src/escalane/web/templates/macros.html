{% macro status_badge(status, t) -%}
<span class="status status-{{ status|lower }}"><span aria-hidden="true"></span>{{ t(status|lower) }}</span>
{%- endmacro %}

{% macro language_select(locale, locales, t, action) -%}
<form class="language-form" method="get" action="{{ action }}">
  <svg class="utility-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>
  <label class="visually-hidden" for="lang">{{ t('language') }}</label>
  <select id="lang" name="lang" aria-label="{{ t('language') }}">
    {% for value in locales %}<option value="{{ value }}" {% if value == locale %}selected{% endif %}>{{ value|upper }}</option>{% endfor %}
  </select>
  <button class="button button-quiet button-small" type="submit">{{ t('change_language') }}</button>
</form>
{%- endmacro %}

{% macro responder_button(label, action, dialog_id='') -%}
<button class="button button-primary responder-control" type="submit" form="{{ action }}"{% if dialog_id %} data-dialog-open="{{ dialog_id }}"{% endif %}>{{ label }}</button>
{%- endmacro %}
