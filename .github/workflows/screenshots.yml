name: Screenshot review

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install capture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/escalane[dev]"
          python -m playwright install --with-deps chromium

      - name: Create an ephemeral simulation configuration
        shell: bash
        run: |
          set -euo pipefail
          admin_key="$(openssl rand -hex 32)"
          database_password="$(openssl rand -hex 32)"
          {
            printf 'POSTGRES_PASSWORD=%s\n' "${database_password}"
            printf 'DATABASE_URL=postgresql+asyncpg://alarm:%s@postgres:5432/alarm\n' "${database_password}"
            printf 'REDIS_URL=redis://redis:6379/0\n'
            printf 'ADMIN_API_KEY=%s\n' "${admin_key}"
            printf 'BASE_URL=http://127.0.0.1:8080\n'
            printf 'SIMULATION_ENABLED=true\n'
            printf 'LOG_LEVEL=WARNING\n'
          } > .env
          printf 'ADMIN_API_KEY=%s\n' "${admin_key}" >> "${GITHUB_ENV}"

      - name: Start the exact candidate
        run: docker compose -f deploy/docker-compose.yml up -d --build

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Capture the Mock University gallery
        run: |
          python scripts/demo_capture.py \
            --admin-key "${ADMIN_API_KEY}" \
            --wait-seconds 60

      - name: Validate the review set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from shutil import copy2

          from scripts.verify_public_hygiene import (
              CURATED_SCREENSHOTS,
              _inspection_reason,
          )

          generated = Path("docs/assets/screenshots/generated")
          review = Path("screenshot-review")
          review.mkdir()
          (review / "SOURCE_COMMIT.txt").write_text(
              f"{os.environ['GITHUB_SHA']}\n",
              encoding="utf-8",
          )

          for relative_path in sorted(CURATED_SCREENSHOTS):
              source = generated / Path(relative_path).name
              reason = _inspection_reason(source, relative_path)
              if reason is not None:
                  raise SystemExit(f"{source}: {reason}")
              copy2(source, review / source.name)
          PY

      - name: Upload screenshots for manual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: escalane-screenshot-review-${{ github.sha }}
          path: screenshot-review/
          if-no-files-found: error
          retention-days: 7

      - name: Show demo logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color

      - name: Stop the demo stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
