name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Run bandit security audit and dependency vulnerability scan
        run: make audit PYTHON=python BANDIT=bandit PIP_AUDIT=pip-audit
