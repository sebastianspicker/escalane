name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Run bandit security audit and dependency vulnerability scan
        run: make audit PYTHON=python BANDIT=bandit PIP_AUDIT=pip-audit
