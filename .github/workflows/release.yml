name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag_sha: ${{ steps.ancestry.outputs.tag_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be on origin/main
        id: ancestry
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          test "$(git cat-file -t "${GITHUB_REF}")" = "tag"
          tag_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          event_sha="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          test "${tag_sha}" = "${event_sha}"
          git merge-base --is-ancestor "${tag_sha}" origin/main
          printf 'tag_sha=%s\n' "${tag_sha}" >> "${GITHUB_OUTPUT}"

  validate:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag_sha }}
          persist-credentials: false

      - name: Validate release tag, package version, and changelog
        id: release_metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  ci:
    needs: [preflight, validate]
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      release_smoke: false

  release:
    runs-on: ubuntu-latest
    needs: [preflight, validate, ci]
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build the release image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.tags }}
            escalane:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Migrate and probe the exact release image
        run: bash scripts/smoke_container.sh escalane:release-candidate

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image and record its digest
        id: publish
        shell: bash
        env:
          RELEASE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          primary_tag=""
          while IFS= read -r tag; do
            test -n "${tag}" || continue
            if test -z "${primary_tag}"; then
              primary_tag="${tag}"
            fi
            docker push "${tag}"
          done <<< "${RELEASE_TAGS}"
          test -n "${primary_tag}"
          digest="$(docker buildx imagetools inspect "${primary_tag}" \
            --format '{{json .Manifest}}' | jq --raw-output '.digest')"
          test -n "${digest}"
          printf 'primary_tag=%s\n' "${primary_tag}" >> "${GITHUB_OUTPUT}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Escalane ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: false
          body: |
            > [!WARNING]
            > Escalane is a public alpha for evaluation. It has not been
            > validated for deployments that require safety, security,
            > compliance, or mission-critical assurance.

            ## Container image

            Deploy the GHCR image tested by this release workflow:

            `${{ steps.publish.outputs.primary_tag }}@${{ steps.publish.outputs.digest }}`

            Pin the image by digest to use the exact build tested here. GitHub
            also provides source archives. CI checks the Python wheel to verify
            packaging, but the wheel is not published.

            ## Alpha limitations

            - Escalane records delivery results and retries failures. A provider
              may receive the same request more than once.
            - Before deploying, test credentials, network rules, backups and
              restore, alerting, capacity, accessibility, and rollback in your
              own environment.
            - See the
              [operations guide](https://github.com/${{ github.repository }}/blob/${{ needs.preflight.outputs.tag_sha }}/docs/OPERATIONS.md),
              [security policy](https://github.com/${{ github.repository }}/blob/${{ needs.preflight.outputs.tag_sha }}/SECURITY.md),
              and
              [changelog](https://github.com/${{ github.repository }}/blob/${{ needs.preflight.outputs.tag_sha }}/CHANGELOG.md)
              for setup requirements, known limitations, and changes in this
              release.
