name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_smoke:
        description: Run the built-container migration and readiness smoke test.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Check constraints, formatting, lint, types, architecture and hygiene
        run: make constraints-check lint type-check architecture-check hygiene-check PYTHON=python RUFF=ruff

      - name: Build and validate the Pages demo
        run: make pages-build pages-check PYTHON=python

  migrations:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alarm -d alarm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Exercise PostgreSQL migrations
        run: make test-postgres-smoke PYTHON=python
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://alarm:postgres@127.0.0.1:5432/alarm
          YELK_IP_ALLOWLIST: 127.0.0.1/32

  security:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Run bandit security audit and dependency vulnerability scan
        run: make audit PYTHON=python BANDIT=bandit PIP_AUDIT=pip-audit

  package:
    runs-on: ubuntu-latest
    needs: [lint, migrations, security]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Build wheel and smoke test the installed package
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          python -m pip install --constraint constraints/python314-build.txt build
          make package-check PYTHON=python

  build:
    runs-on: ubuntu-latest
    needs: [lint, migrations, security, package]
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || inputs.release_smoke || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: escalane:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker images | grep escalane

      - name: Migrate and probe the built image
        run: bash scripts/smoke_container.sh escalane:dev
