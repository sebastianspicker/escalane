name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_smoke:
        description: Run the built-container migration and readiness smoke test.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Check public repository hygiene
        run: git ls-files --cached --others --exclude-standard -z | python scripts/verify_public_hygiene.py --null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage -e ".[dev]"

      - name: Check formatting
        run: ruff format --check src tests migrations scripts

      - name: Run linter
        run: ruff check src tests migrations scripts

      - name: Type check
        run: python -m mypy src migrations scripts

      - name: Check import architecture
        run: python scripts/check_architecture.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alarm -d alarm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage -e ".[dev]"

      - name: Run coverage contracts
        run: |
          python -m coverage run -m pytest -q --tb=short
          python -m coverage report

      - name: Exercise PostgreSQL migrations and outbox concurrency
        run: make test-postgres-smoke PYTHON=python
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://alarm:postgres@127.0.0.1:5432/alarm
          YELK_IP_ALLOWLIST: 127.0.0.1/32

  security:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run bandit security audit
        # Static translation labels trigger B105; all executable modules remain scanned.
        run: |
          bandit -q -r -x src/escalane/web/i18n.py src/escalane
          # Script fixtures and fixed-argv Git inspection have reviewed low findings; enforce medium+.
          bandit -q -ll -r scripts

      - name: Run dependency vulnerability scan
        run: pip-audit

  package:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          rm -rf src/escalane.egg-info build/lib
          if test -d build; then find build -maxdepth 1 -type d -name 'bdist.*' -exec rm -rf {} +; fi
          python -m build --wheel
          python scripts/validate_wheel.py dist/escalane-*.whl

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/escalane-wheel
          /tmp/escalane-wheel/bin/pip install --quiet dist/escalane-*.whl
          env -i HOME="$HOME" PATH="/tmp/escalane-wheel/bin:/usr/bin:/bin" PYTHONPATH="" /tmp/escalane-wheel/bin/python -c "from importlib.resources import files; from pathlib import Path; import escalane; import escalane.web.routes.admin_ui; import escalane.web.ack_presentation; origin = Path(escalane.__file__).resolve(); assert origin.is_relative_to(Path('/tmp/escalane-wheel')), origin; root = files('escalane.web'); assert root.joinpath('templates', 'base.html').is_file(); assert root.joinpath('templates', 'ack.html').is_file(); assert root.joinpath('assets', 'ui.css').is_file(); assert root.joinpath('assets', 'ui.js').is_file(); assert root.joinpath('assets', 'escalane-mark.svg').is_file()"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security, package]
    timeout-minutes: 15
    if: inputs.release_smoke || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: escalane:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker images | grep escalane

      - name: Migrate and probe the built image
        run: bash scripts/smoke_container.sh escalane:dev
