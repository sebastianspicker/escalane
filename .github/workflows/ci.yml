name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_smoke:
        description: Run the built-container migration and readiness smoke test.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Check public repository hygiene
        run: git ls-files --cached --others --exclude-standard -z | python scripts/verify_public_hygiene.py --null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/escalane[dev]"

      - name: Check formatting
        run: ruff format --check services/escalane

      - name: Run linter
        run: ruff check services/escalane

      - name: Type check
        run: python -m mypy --config-file services/escalane/pyproject.toml services/escalane/escalane

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/escalane[dev]"

      - name: Run tests with coverage
        run: cd services/escalane && pytest -q -m "not e2e" --cov=escalane --cov-report=term-missing --tb=short

  e2e:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/escalane[dev]"

      - name: Install browser engines
        run: python -m playwright install --with-deps chromium firefox webkit

      - name: Run served HTTP and browser E2E tests
        run: cd services/escalane && pytest -q tests/e2e --tb=short

  postgres-smoke:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    env:
      YELK_IP_ALLOWLIST: 127.0.0.1/32
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: alarm
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alarm -d alarm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/escalane[dev]"

      - name: Configure PostgreSQL URLs
        shell: bash
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: alarm
        run: |
          database_url="postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"
          {
            printf 'DATABASE_URL=%s\n' "${database_url}"
            printf 'TEST_DATABASE_URL=%s\n' "${database_url}"
          } >> "${GITHUB_ENV}"

      - name: Apply Alembic migrations
        run: cd services/escalane && alembic upgrade head

      - name: Run PostgreSQL smoke test
        run: cd services/escalane && pytest -q tests/integration/test_postgres_smoke.py --tb=short

  security:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/escalane[dev]"

      - name: Run bandit security audit
        run: bandit -q -r -x services/escalane/escalane/api/i18n.py services/escalane/escalane

      - name: Run dependency vulnerability scan
        run: cd services/escalane && pip-audit

  package:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
          cache: "pip"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          cd services/escalane && python -m build --wheel

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/escalane-wheel
          /tmp/escalane-wheel/bin/pip install --quiet services/escalane/dist/escalane-*.whl
          env -i HOME="$HOME" PATH="/tmp/escalane-wheel/bin:/usr/bin:/bin" PYTHONPATH="" /tmp/escalane-wheel/bin/python -c "from importlib.resources import files; import escalane.api.routes.admin_ui; import escalane.services.ack_ui; root = files('escalane.api'); assert root.joinpath('templates', 'base.html').is_file(); assert root.joinpath('templates', 'ack.html').is_file(); assert root.joinpath('assets', 'ui.css').is_file(); assert root.joinpath('assets', 'ui.js').is_file(); assert root.joinpath('assets', 'escalane-mark.svg').is_file()"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, e2e, postgres-smoke, security, package]
    timeout-minutes: 15
    if: inputs.release_smoke || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: escalane:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker images | grep escalane

      - name: Migrate and probe the built image
        run: bash scripts/smoke_container.sh escalane:dev
