name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_smoke:
        description: Run the built-container migration and readiness smoke test.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Check constraints, formatting, lint, types, architecture and hygiene
        run: make constraints-check lint type-check architecture-check hygiene-check PYTHON=python RUFF=ruff

      - name: Build and validate the Pages demo
        run: make pages-build pages-check PYTHON=python

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alarm
          POSTGRES_USER: alarm
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alarm -d alarm"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Run coverage contracts
        run: make coverage PYTHON=python

      - name: Exercise PostgreSQL migrations and outbox concurrency
        run: make test-postgres-smoke PYTHON=python
        env:
          TEST_POSTGRES_URL: postgresql+asyncpg://alarm:postgres@127.0.0.1:5432/alarm
          YELK_IP_ALLOWLIST: 127.0.0.1/32

  security:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          PIP_BUILD_CONSTRAINT=constraints/python314-build.txt python -m pip install --constraint constraints/python314-dev.txt -e ".[dev]"

      - name: Run bandit security audit and dependency vulnerability scan
        run: make audit PYTHON=python BANDIT=bandit PIP_AUDIT=pip-audit

  package:
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.7"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints/*.txt

      - name: Build wheel and smoke test the installed package
        run: |
          python -m pip install --constraint constraints/python314-build.txt --upgrade pip
          python -m pip install --constraint constraints/python314-build.txt build
          make package-check PYTHON=python

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, security, package]
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || inputs.release_smoke || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: escalane:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker images | grep escalane

      - name: Migrate and probe the built image
        run: bash scripts/smoke_container.sh escalane:dev
