[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "escalane"
dynamic = ["version"]
description = "Escalane public-alpha alarm intake, acknowledgement, notification, and escalation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "greenlet>=3.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "arq>=0.28",
  "httpx>=0.27",
  "Jinja2>=3.1,<4",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/sebastianspicker/escalane"
Repository = "https://github.com/sebastianspicker/escalane"
Issues = "https://github.com/sebastianspicker/escalane/issues"
Changelog = "https://github.com/sebastianspicker/escalane/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "Pygments>=2.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["escalane*"]

[tool.setuptools.package-data]
"escalane.api" = ["templates/*.html", "assets/*.css", "assets/*.js", "assets/*.svg"]

[tool.setuptools.dynamic]
version = {attr = "escalane.__version__"}

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["escalane"]
concurrency = ["greenlet", "thread"]
omit = ["*/tests/*", "*/alembic/*", "*/worker/settings.py", "*/seed.py"]

[tool.coverage.report]
show_missing = true
fail_under = 93
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
