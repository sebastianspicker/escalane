{% extends "base.html" %}
{% block title %}{{ t('escalation') }} · {{ t('product_name') }}{% endblock %}
{% block content %}<header class="page-heading"><div><p class="eyebrow">{{ t('configuration') }}</p><h1>{{ t('escalation_policy') }}</h1><p class="page-summary">{{ t('escalation_help') }}</p></div></header><section class="editor-panel"><p class="notice notice-info">{{ t('write_only_targets') }}</p><form method="post" action="/admin/configuration/escalation"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="version" value="{{ policy_version }}"><label for="policy-json">{{ t('policy_json') }}</label><textarea class="code-editor" id="policy-json" name="policy_json" rows="24" spellcheck="false" required>{{ policy_json }}</textarea><button class="button button-primary" type="submit">{{ t('save_policy') }}</button></form></section>{% endblock %}
