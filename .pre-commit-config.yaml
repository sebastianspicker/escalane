# =============================================================================
# Pre-commit hooks for escalane
# =============================================================================
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
# =============================================================================

repos:
  - repo: local
    hooks:
      - id: public-repository-hygiene
        name: public repository hygiene
        entry: python scripts/verify_public_hygiene.py
        language: system
        pass_filenames: false

  # Ruff - run through the Makefile so the pinned project version is used
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff format and lint check (make lint)
        entry: make lint
        language: system
        pass_filenames: false
        types: [python]

  # YAML validation
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0-alpha.9-for-vscode
    hooks:
      - id: prettier
        types: [yaml]
        args: ["--tab-width", "2"]

  # Detect secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  # Check for debug statements
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb", "1000"]
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix", "lf"]
